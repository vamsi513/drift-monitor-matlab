name: tests

# MathWorks licenses MATLAB automatically for public repositories when the
# tests run through the official actions, so no licence token is needed here.
# See https://github.com/matlab-actions/setup-matlab ("Public project").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: MATLAB unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: R2024b

      - name: Report MATLAB release
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: |
            fprintf('MATLAB release: %s\n', version('-release'));

      - name: Run tests
        uses: matlab-actions/run-tests@214a16e600ef2c705a4b2dd6c0794dc6957682a9 # v3.3.0
        with:
          source-folder: .
          select-by-folder: tests
          test-results-junit: test-results/results.xml
          output-detail: detailed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/results.xml
          if-no-files-found: error
